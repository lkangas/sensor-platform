# fail2ban filter for Mosquitto auth failures (docker, journald logging driver).
# Install to /etc/fail2ban/filter.d/mosquitto-docker.conf
#
# Matches (mosquitto 2.x):
#   1783022381: Client auto-F769...4AF4 [212.90.83.17:54133] disconnected: not authorised.
[INCLUDES]
before = common.conf

[Definition]
# Journal lines arrive as "<date> <host> <containerid>[<pid>]: <epoch>: <msg>" —
# __prefix_line (from common.conf) eats the host/tag part; mosquitto's own epoch
# prefix ("1783022381: ") is matched explicitly.
failregex = ^%(__prefix_line)s\d+: Client \S+ \[<HOST>:\d+\] disconnected: not authorised\.\s*$
journalmatch = CONTAINER_NAME=server-mosquitto-1
