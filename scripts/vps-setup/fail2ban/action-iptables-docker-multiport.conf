# fail2ban action: ban into Docker's DOCKER-USER chain instead of INPUT.
# Install to /etc/fail2ban/action.d/iptables-docker-multiport.conf
#
# WHY: docker-published ports (8883 here) are DNAT'd and traverse FORWARD, not
# INPUT. A ban placed in INPUT (the stock iptables-multiport default) is simply
# bypassed. Docker's documented user hook is the DOCKER-USER chain, which runs
# at the top of FORWARD. Passing chain=DOCKER-USER as an inline override to
# iptables-multiport did NOT take effect on this host, so the chain is pinned
# here in [Init] instead, which is honored reliably.
#
# The base actions use `-I <chain>`, inserting our jump at the top of
# DOCKER-USER (ahead of Docker's own RETURN), so the REJECT is evaluated first.
[INCLUDES]
before = iptables.conf

[Definition]
type = multiport

[Init]
chain = DOCKER-USER
