# Grafana-managed alert rules, provisioned as code (Phase 6/M6).
# NOTE: no notification contact point is configured yet (no SMTP) — firing alerts
# are visible in Grafana's Alerting UI; wiring email/Telegram/ntfy is a later step.
apiVersion: 1

groups:
  - orgId: 1
    name: sensor-health
    folder: Sensor platform
    interval: 5m
    rules:
      # Firing verified 2026-07-02 with a temporary 2700 mV threshold (two tags
      # alerted, including a previously unseen one); production threshold 2500.
      - uid: low-battery
        title: Low sensor battery
        condition: C
        for: 0s
        noDataState: OK
        execErrState: Error
        annotations:
          summary: "Sensor {{ $labels.sensor }} battery is low"
        data:
          - refId: A
            relativeTimeRange: { from: 86400, to: 0 }
            datasourceUid: timescaledb
            model:
              refId: A
              format: table
              rawQuery: true
              rawSql: >-
                SELECT DISTINCT ON (sensor_id)
                  COALESCE(sensor_name, sensor_id) AS sensor,
                  battery_mv
                FROM sensor_readings
                ORDER BY sensor_id, time DESC
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [2500] }

      # Meaningful once a real site publishes continuously (M5); the bursty
      # 'test' site is excluded so manual test runs don't false-alarm.
      - uid: sensor-offline
        title: Sensor offline
        condition: C
        for: 10m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: "No data from {{ $labels.sensor }} for over 30 minutes"
        data:
          - refId: A
            relativeTimeRange: { from: 86400, to: 0 }
            datasourceUid: timescaledb
            model:
              refId: A
              format: table
              rawQuery: true
              rawSql: >-
                SELECT COALESCE(sensor_name, sensor_id) AS sensor,
                       extract(epoch FROM now() - max(time)) AS age_s
                FROM sensor_readings
                WHERE site <> 'test'
                GROUP BY 1
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [1800] }
