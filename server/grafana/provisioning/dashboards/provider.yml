# Dashboard provider — any *.json committed to this directory appears in Grafana.
# Starter dashboards land here in M6.
apiVersion: 1

providers:
  - name: sensor-platform
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    # allow editing provisioned dashboards in the browser and saving (persists to
    # Grafana's DB). The JSON file in git stays the source of truth: after editing,
    # pull the JSON back into the repo (scripts/grafana-pull-dashboard.sh) and
    # commit, so a rebuild reproduces your changes.
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards
      # Each subdirectory under path becomes a Grafana folder named after it:
      #   dashboards/Public/*   -> "Public" folder (anonymous-visible)
      #   dashboards/Private/*  -> "Private" folder (admin-only; perms set via API)
      foldersFromFilesStructure: true
