# Core server stack (Phase 2/M2). Secrets come from ./.env (git-ignored; see .env.example).
# Images are unpinned on purpose until first deploy verifies them; pin digests afterwards.
services:

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: sensors
      # read by db/init/002_users.sh on FIRST boot only
      TELEGRAF_DB_PASS: ${TELEGRAF_DB_PASS}
      GRAFANA_DB_PASS: ${GRAFANA_DB_PASS}
    volumes:
      - tsdb-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sensors"]
      interval: 10s
      timeout: 5s
      retries: 12
    # never published to the host — internal network only

  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - "8883:8883"          # MQTT over TLS (edge sites); 1883 stays internal
    logging:
      driver: journald       # fail2ban reads auth failures from the journal
                             # (json-file paths change on container recreation)
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/acl:/mosquitto/config/acl:ro
      - ./mosquitto/acl-internal:/mosquitto/config/acl-internal:ro
      - ./mosquitto/passwd:/mosquitto/config/passwd:ro   # created on the VPS, git-ignored
      - ./mosquitto/entrypoint.sh:/entrypoint-certsync.sh:ro
      - caddy-data:/caddy-data:ro                        # read Caddy's LE cert
      - mosq-certs:/mosquitto/certs
      - mosq-data:/mosquitto/data
    # wrapper waits for Caddy's certificate, copies it for the TLS listener,
    # then re-syncs every 12h and HUPs mosquitto when the cert renews
    entrypoint: ["/bin/sh", "/entrypoint-certsync.sh"]
    depends_on:
      - caddy

  # Decoder for the 'ruuvi' source, site 'test' (Phase 0 publisher / M4 smoke test).
  # One instance per site: the publisher's topic_prefix is static, so per-site
  # instances are how decoded topics keep their site segment. Adding a site =
  # copy this block + a config file with the site name changed (M5).
  ruuvibridge-test:
    image: ghcr.io/scrin/ruuvibridge:latest
    restart: unless-stopped
    volumes:
      - ./ruuvibridge/config-test.yml:/config.yml:ro
    depends_on:
      - mosquitto

  # Decoder for site 'home' (M5 — first real edge node).
  ruuvibridge-home:
    image: ghcr.io/scrin/ruuvibridge:latest
    restart: unless-stopped
    volumes:
      - ./ruuvibridge/config-home.yml:/config.yml:ro
    depends_on:
      - mosquitto

  # Fills the gap RuuviBridge leaves: decodes Ruuvi Air data format E1 (BT5 extended
  # advertisement — PM1.0/PM4.0/PM10.0 + hi-res PM2.5) from the raw <site>/ruuvi/<mac>
  # topics and republishes into decoded/<site>/ruuvi/<mac>. RuuviBridge still handles
  # DF6 and all tags; this only acts on E1. (Air has no light sensor → lux stays NULL.)
  air-e1-decoder:
    build: ./air-e1-decoder
    restart: unless-stopped
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
    depends_on:
      - mosquitto

  telegraf:
    image: telegraf:latest
    restart: unless-stopped
    environment:
      TELEGRAF_DB_PASS: ${TELEGRAF_DB_PASS}
    volumes:
      - ./telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro
    depends_on:
      timescaledb:
        condition: service_healthy
      mosquitto:
        condition: service_started

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: https://petzval.dy.fi
      GRAFANA_DB_PASS: ${GRAFANA_DB_PASS}   # interpolated in datasource provisioning
      # Public, read-only view: anyone reaching the site sees the "Public" folder
      # dashboards without logging in. Folder permissions (set via API) keep the
      # "Private" folder admin-only, so logging in exposes the detailed dashboards.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_ANONYMOUS_ORG_NAME: "Main Org."
      GF_AUTH_ANONYMOUS_HIDE_VERSION: "true"
      # Land anonymous visitors straight on the simple public dashboard.
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/Public/public-sensors.json
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      timescaledb:
        condition: service_healthy
    # internal only — Caddy fronts it

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"              # ACME HTTP-01 + redirect to HTTPS
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  tsdb-data:
  mosq-data:
  mosq-certs:
  grafana-data:
  caddy-data:
  caddy-config:
