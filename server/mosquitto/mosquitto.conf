# Two listeners with different trust models (per_listener_settings):
#
#  - 1883, internal Docker network only (never published to the host): anonymous,
#    limited by acl-internal. Trust boundary = membership of the compose network;
#    this keeps broker credentials out of the ruuvibridge/telegraf configs so
#    those files are fully committable.
#  - 8883, exposed to the internet (ufw): TLS with Caddy's Let's Encrypt cert,
#    per-site username/password + ACL so a site can only write its own prefix.

per_listener_settings true
persistence true
persistence_location /mosquitto/data/
log_dest stdout

# --- internal listener (docker network only) ---
listener 1883
allow_anonymous true
acl_file /mosquitto/config/acl-internal

# --- external listener (8883, edge sites) ---
# NOT defined here: entrypoint.sh writes it into rt.d/ once Caddy's certificate
# exists, so the internal listener never depends on TLS/ACME being up.
include_dir /mosquitto/rt.d
