# Telegraf: source-agnostic MQTT→TimescaleDB writer. Subscribes to decoded/#
# (all sources), maps topic segments to site/source/sensor_id, renames fields to
# the sensor_readings columns, and inserts. This file is the ONLY place that
# understands the topic shape; it never decodes any source's wire format.
#
# PROVISIONAL (verify at M4 with live data): RuuviBridge JSON field names/units —
# assumed camelCase per RuuviCollector heritage, pressure in Pa, batteryVoltage
# in volts. The starlark + rename blocks below encode those assumptions.
#
# Ruuvi Air (data format E1) fields added below are NOT provisional — the JSON keys
# are read straight from RuuviBridge parser/measurement.go (AirQualityData). They
# stay NULL until an Air unit publishes; a plain RuuviTag never emits them. E1
# pressure is Pa like DF5, so the Pa->hPa starlark below covers it unchanged.

[agent]
  interval = "10s"
  flush_interval = "10s"
  omit_hostname = true          # no host tag → no surprise column in the table

[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]   # internal listener, anonymous
  topics = ["decoded/+/ruuvi/+", "+/host/+", "+/hue/+"]
  qos = 0
  data_format = "json"
  json_string_fields = ["name", "event"]   # name → sensor_name; event = Hue button events
  name_override = "sensor_readings"    # = target table

  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "decoded/+/ruuvi/+"
    tags = "_/site/source/sensor_id"
  # Host/node metrics (source='host') publish clean values straight to <site>/host/<node>
  # (no decoder needed). Same site/source/sensor_id mapping, one topic segment shorter.
  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "+/host/+"
    tags = "site/source/sensor_id"
  # Hue collector (source='hue'): <site>/hue/<device-uuid>, published from the home edge
  # node over the external listener (its ACL allows only <site>/#, hence no decoded/ prefix).
  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "+/hue/+"
    tags = "site/source/sensor_id"

# FMI weather (source='fmi') gets its OWN consumer: the payload carries the true
# observation time ("time", ISO 8601), consumed here as the metric timestamp so rows land
# on FMI's 10-min grid instead of at poller-arrival time. json_time_key must not be set on
# the shared consumer above (ruuvi/host payloads have no such key).
[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics = ["decoded/+/fmi/+"]
  qos = 0
  data_format = "json"
  json_time_key = "time"
  json_time_format = "2006-01-02T15:04:05Z07:00"
  name_override = "sensor_readings"

  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "decoded/+/fmi/+"
    tags = "_/site/source/sensor_id"

# Ingest dedupe (plan §11): devices repeat each measurement over several BLE adverts and
# every advert otherwise becomes a row. Drop a metric when it carries nothing new:
#   * tags (DF5):        same 16-bit measurementSequenceNumber as the last kept row
#   * Air-class DF6/E1:  same measurement CONTENT (the DF6 counter is 8-bit, ticks per
#     advert group and wraps ~3.5 min — not a measurement id; E1 has no counter field).
#     rssi/txPower/batteryVoltage/counter are excluded from the signature (radio/power
#     telemetry — still stored on kept rows, must not defeat dedupe by jittering).
# Keyed per site|sensor|stream: the same MAC heard by two sites is never cross-suppressed,
# and — critically — an Air's DF6 and E1 adverts interleave on the wire, so the two formats
# must not share one state slot (they would endlessly overwrite each other and nothing
# would dedupe). The content branch keys on the field-NAME set, which is distinct per
# format and stable even when invalid readings drop individual fields.
# State is in-memory: a telegraf restart admits at most one duplicate per sensor/stream.
[[processors.starlark]]
  order = 0
  source = '''
state = {}

def apply(metric):
    if metric.tags.get("source") != "ruuvi":
        return metric                    # host metrics and future sources pass untouched
    base = metric.tags.get("site", "") + "|" + metric.tags.get("sensor_id", "")
    seq = metric.fields.get("measurementSequenceNumber")
    if seq != None and metric.fields.get("co2") == None and metric.fields.get("pm2p5") == None:
        key = base + "|seq"
        sig = str(seq)                   # plain tag: true per-measurement counter
    else:
        names = []
        vals = []
        for k in sorted(metric.fields.keys()):
            if k not in ("rssi", "txPower", "batteryVoltage", "measurementSequenceNumber"):
                names.append(k)
                vals.append(k + "=" + str(metric.fields[k]))
        key = base + "|" + ",".join(names)   # per-format slot (DF6 and E1 field sets differ)
        sig = ";".join(vals)             # Air-class: measurement content identity
    if state.get(key) == sig:
        return None                      # duplicate advert -> never reaches the DB
    state[key] = sig
    return metric
'''

# unit conversions first…
[[processors.starlark]]
  order = 1
  source = '''
def apply(metric):
    # batteryVoltage V (float) -> battery_mv (int)
    v = metric.fields.pop("batteryVoltage", None)
    if v != None:
        metric.fields["battery_mv"] = int(v * 1000 + 0.5)
    # pressure Pa -> hPa (guard: skip if a source already sends hPa)
    p = metric.fields.get("pressure")
    if p != None and p > 2000:
        metric.fields["pressure"] = p / 100.0
    # not a column; sensor_id tag already carries identity
    metric.fields.pop("dataFormat", None)
    metric.fields.pop("mac", None)
    return metric
'''

# …then pure renames to column names
[[processors.rename]]
  order = 2
  [[processors.rename.replace]]
    field = "accelerationX"
    dest = "accel_x"
  [[processors.rename.replace]]
    field = "accelerationY"
    dest = "accel_y"
  [[processors.rename.replace]]
    field = "accelerationZ"
    dest = "accel_z"
  [[processors.rename.replace]]
    field = "movementCounter"
    dest = "movement_ctr"
  [[processors.rename.replace]]
    field = "measurementSequenceNumber"
    dest = "seq"
  [[processors.rename.replace]]
    field = "txPower"
    dest = "tx_power"
  [[processors.rename.replace]]
    field = "name"
    dest = "sensor_name"
  # Ruuvi Air (E1): particulate matter + illuminance. co2/voc/nox already match
  # the column names, so they need no rename — just the fieldinclude entries below.
  [[processors.rename.replace]]
    field = "pm1p0"
    dest = "pm1_0"
  [[processors.rename.replace]]
    field = "pm2p5"
    dest = "pm2_5"
  [[processors.rename.replace]]
    field = "pm4p0"
    dest = "pm4_0"
  [[processors.rename.replace]]
    field = "pm10p0"
    dest = "pm10_0"
  [[processors.rename.replace]]
    field = "illuminance"
    dest = "lux"

[[outputs.postgresql]]
  connection = "host=timescaledb user=telegraf password=${TELEGRAF_DB_PASS} dbname=sensors sslmode=disable"
  timestamp_column_name = "time"
  # whitelist = the fixed schema; anything unexpected is dropped here instead of
  # triggering an automatic ALTER TABLE (outputs.postgresql adds columns by default)
  fieldinclude = [
    "temperature", "humidity", "pressure", "battery_mv", "tx_power",
    "accel_x", "accel_y", "accel_z", "movement_ctr", "seq", "rssi",
    "sensor_name",
    # Ruuvi Air (E1); NULL for tags. PM µg/m³, co2 ppm, voc/nox index, lux.
    "pm1_0", "pm2_5", "pm4_0", "pm10_0", "co2", "voc", "nox", "lux",
    # Host/node metrics (source='host'): SoC temp reuses 'temperature'; the rest below.
    "throttled", "cpu_pct", "cpu_load1", "cpu_mhz", "mem_pct", "disk_pct",
    "core_volt", "wifi_rssi", "power_w", "ssd_temp",
    # Hue (source='hue'): motion 0/1, button events as text, battery %; temp/lux reuse
    # the shared columns above (migration 007 adds these three).
    "motion", "event", "battery_pct",
  ]
  taginclude = ["site", "source", "sensor_id"]
