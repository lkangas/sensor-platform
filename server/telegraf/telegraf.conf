# Telegraf: source-agnostic MQTT→TimescaleDB writer. Subscribes to decoded/#
# (all sources), maps topic segments to site/source/sensor_id, renames fields to
# the sensor_readings columns, and inserts. This file is the ONLY place that
# understands the topic shape; it never decodes any source's wire format.
#
# PROVISIONAL (verify at M4 with live data): RuuviBridge JSON field names/units —
# assumed camelCase per RuuviCollector heritage, pressure in Pa, batteryVoltage
# in volts. The starlark + rename blocks below encode those assumptions.
#
# Ruuvi Air (data format E1) fields added below are NOT provisional — the JSON keys
# are read straight from RuuviBridge parser/measurement.go (AirQualityData). They
# stay NULL until an Air unit publishes; a plain RuuviTag never emits them. E1
# pressure is Pa like DF5, so the Pa->hPa starlark below covers it unchanged.

[agent]
  interval = "10s"
  flush_interval = "10s"
  omit_hostname = true          # no host tag → no surprise column in the table

[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]   # internal listener, anonymous
  topics = ["decoded/+/ruuvi/+", "+/host/+"]
  qos = 0
  data_format = "json"
  json_string_fields = ["name"]        # → sensor_name; other strings dropped
  name_override = "sensor_readings"    # = target table

  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "decoded/+/ruuvi/+"
    tags = "_/site/source/sensor_id"
  # Host/node metrics (source='host') publish clean values straight to <site>/host/<node>
  # (no decoder needed). Same site/source/sensor_id mapping, one topic segment shorter.
  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "+/host/+"
    tags = "site/source/sensor_id"

# unit conversions first…
[[processors.starlark]]
  order = 1
  source = '''
def apply(metric):
    # batteryVoltage V (float) -> battery_mv (int)
    v = metric.fields.pop("batteryVoltage", None)
    if v != None:
        metric.fields["battery_mv"] = int(v * 1000 + 0.5)
    # pressure Pa -> hPa (guard: skip if a source already sends hPa)
    p = metric.fields.get("pressure")
    if p != None and p > 2000:
        metric.fields["pressure"] = p / 100.0
    # not a column; sensor_id tag already carries identity
    metric.fields.pop("dataFormat", None)
    metric.fields.pop("mac", None)
    return metric
'''

# …then pure renames to column names
[[processors.rename]]
  order = 2
  [[processors.rename.replace]]
    field = "accelerationX"
    dest = "accel_x"
  [[processors.rename.replace]]
    field = "accelerationY"
    dest = "accel_y"
  [[processors.rename.replace]]
    field = "accelerationZ"
    dest = "accel_z"
  [[processors.rename.replace]]
    field = "movementCounter"
    dest = "movement_ctr"
  [[processors.rename.replace]]
    field = "measurementSequenceNumber"
    dest = "seq"
  [[processors.rename.replace]]
    field = "txPower"
    dest = "tx_power"
  [[processors.rename.replace]]
    field = "name"
    dest = "sensor_name"
  # Ruuvi Air (E1): particulate matter + illuminance. co2/voc/nox already match
  # the column names, so they need no rename — just the fieldinclude entries below.
  [[processors.rename.replace]]
    field = "pm1p0"
    dest = "pm1_0"
  [[processors.rename.replace]]
    field = "pm2p5"
    dest = "pm2_5"
  [[processors.rename.replace]]
    field = "pm4p0"
    dest = "pm4_0"
  [[processors.rename.replace]]
    field = "pm10p0"
    dest = "pm10_0"
  [[processors.rename.replace]]
    field = "illuminance"
    dest = "lux"

[[outputs.postgresql]]
  connection = "host=timescaledb user=telegraf password=${TELEGRAF_DB_PASS} dbname=sensors sslmode=disable"
  timestamp_column_name = "time"
  # whitelist = the fixed schema; anything unexpected is dropped here instead of
  # triggering an automatic ALTER TABLE (outputs.postgresql adds columns by default)
  fieldinclude = [
    "temperature", "humidity", "pressure", "battery_mv", "tx_power",
    "accel_x", "accel_y", "accel_z", "movement_ctr", "seq", "rssi",
    "sensor_name",
    # Ruuvi Air (E1); NULL for tags. PM µg/m³, co2 ppm, voc/nox index, lux.
    "pm1_0", "pm2_5", "pm4_0", "pm10_0", "co2", "voc", "nox", "lux",
    # Host/node metrics (source='host'): SoC temp reuses 'temperature'; the rest below.
    "throttled", "cpu_pct", "cpu_load1", "cpu_mhz", "mem_pct", "disk_pct",
    "core_volt", "wifi_rssi", "power_w", "ssd_temp",
  ]
  taginclude = ["site", "source", "sensor_id"]
