# Host-metrics publisher as a CONTAINER — for edge hosts WITHOUT mosquitto-clients or
# passwordless sudo (e.g. a desktop-class node). Runs the same publish-host-metrics.sh; reads CPU stats
# from the container's /proc (already host-wide) and temps/power from the host /sys (mounted
# read-only), running as root so it can read the RAPL energy counter. On a node that has
# mosquitto-clients (a Pi), use the systemd user service instead (see README).
#   deploy:  docker compose -f edge/host-metrics/docker-compose.yml up -d --build
services:
  host-metrics:
    build: .
    container_name: host-metrics
    restart: unless-stopped
    environment:
      # The host's real hostname → the node's sensor_id. WITHOUT it the container id is used,
      # and the Perf board gains a fresh <container-id>-cpuN series on every recreate. Set it
      # PERSISTENTLY in this dir's .env (edge/host-metrics/.env: HOST_NODE=<hostname>) so every
      # `docker compose up` picks it up — a one-off HOST_NODE=... on the CLI is lost on recreate.
      HOST_NODE: ${HOST_NODE:-}
      EXTRA_DISKS: ${EXTRA_DISKS:-}   # e.g. "ssd:/mnt/ssd" -> a <node>-ssd disk series
    env_file: ../.env            # SITE + MQTT creds (already present for the edge)
    volumes:
      - /sys:/sys:ro             # hwmon (temps), powercap (RAPL), cpufreq
      # Optional extra data disk to report (e.g. an SSD). Bind-mount it read-only at the SAME
      # path the host uses and list it in EXTRA_DISKS (both live in edge/host-metrics/.env):
      #   SSD_MOUNT=/mnt/ssd  +  EXTRA_DISKS=ssd:/mnt/ssd
      # Unset -> harmlessly self-maps /sys and the script skips it (EXTRA_DISKS empty).
      - ${SSD_MOUNT:-/sys}:/mnt/ssd:ro
