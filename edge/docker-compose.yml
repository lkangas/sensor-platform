# Profile B (default): x86_64 and Docker-capable ARM (Pi 3-series or better).
# BLE scanning from a container needs the host's Bluetooth stack: host networking
# + NET_ADMIN/NET_RAW. Built-in adapters need no device mapping; for a USB dongle
# that doesn't appear on hci0, add a `devices:` mapping and set hci_index.
services:
  ruuvi-gateway:
    image: ghcr.io/scrin/ruuvi-go-gateway:latest
    container_name: ruuvi-go-gateway
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - ./ruuvi-go-gateway/config.yml:/config.yml:ro   # generated by bootstrap-edge.sh
    # If BLE scanning fails: confirm `bluetooth.service` is up on the host and no
    # other process holds the adapter (`sudo hcitool lescan` should list tags).
